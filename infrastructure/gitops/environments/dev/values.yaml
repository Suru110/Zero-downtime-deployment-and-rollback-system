# Example desired state consumed by the ReleasePilot Helm chart.
# Image tags are immutable commit SHAs and are updated by the opt-in GitOps job.
images:
  backend:
    repository: ghcr.io/example-org/releasepilot-backend
    tag: replace-with-commit-sha
  frontend:
    repository: ghcr.io/example-org/releasepilot-frontend
    tag: replace-with-commit-sha

database:
  enabled: false

secrets:
  create: false
  existingSecret: releasepilot-secrets

ingress:
  enabled: false
