apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "releasepilot.fullname" . }}-backend
  labels:
    {{- include "releasepilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.backend.strategy.maxSurge }}
      maxUnavailable: {{ .Values.backend.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "releasepilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "releasepilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "releasepilot.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "releasepilot.secretName" . }}
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "releasepilot.secretName" . }}
                  key: jwt-secret-key
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "releasepilot.secretName" . }}
                  key: admin-initial-password
            - name: CORS_ORIGINS
              value: {{ .Values.config.corsOrigins | quote }}
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.config.accessTokenExpireMinutes | quote }}
            - name: DEFAULT_ROLLBACK_ENABLED
              value: {{ .Values.config.defaultRollbackEnabled | quote }}
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startupPath }}
              port: http
            failureThreshold: {{ .Values.backend.probes.startupFailureThreshold }}
            periodSeconds: {{ .Values.backend.probes.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.livenessPath }}
              port: http
            periodSeconds: {{ .Values.backend.probes.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readinessPath }}
              port: http
            periodSeconds: {{ .Values.backend.probes.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
