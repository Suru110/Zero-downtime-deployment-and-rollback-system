apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "releasepilot.fullname" . }}-frontend
  labels:
    {{- include "releasepilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.frontend.strategy.maxSurge }}
      maxUnavailable: {{ .Values.frontend.strategy.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "releasepilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "releasepilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: {{ .Values.frontend.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.path }}
              port: http
            periodSeconds: {{ .Values.frontend.probes.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.path }}
              port: http
            periodSeconds: {{ .Values.frontend.probes.periodSeconds }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "releasepilot.fullname" . }}-frontend-nginx
