apiVersion: v1
kind: Service
metadata:
  name: {{ include "releasepilot.fullname" . }}-backend
  labels:
    {{- include "releasepilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "releasepilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
