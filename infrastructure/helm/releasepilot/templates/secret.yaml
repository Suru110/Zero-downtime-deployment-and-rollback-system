{{- if .Values.secrets.create }}
{{- if or (empty .Values.secrets.databasePassword) (empty .Values.secrets.jwtSecretKey) (empty .Values.secrets.adminInitialPassword) (empty .Values.secrets.databaseUrl) }}
{{- fail "secrets.databasePassword, secrets.jwtSecretKey, and secrets.adminInitialPassword must be supplied (for example with --set-string or a private values file)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "releasepilot.fullname" . }}-secrets
  labels:
    {{- include "releasepilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  database-password: {{ .Values.secrets.databasePassword | quote }}
  database-user: {{ .Values.secrets.databaseUser | quote }}
  database-name: {{ .Values.secrets.databaseName | quote }}
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | quote }}
  admin-initial-password: {{ .Values.secrets.adminInitialPassword | quote }}
{{- end }}
