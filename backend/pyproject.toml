[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "releasepilot-backend"
version = "0.1.0"
description = "ReleasePilot Core API & Deployment Engine"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = "test_*.py"
asyncio_mode = "auto"
