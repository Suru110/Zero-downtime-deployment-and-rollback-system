name: Reusable quality gates

on:
  workflow_call:
    secrets: {}

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q app
      - name: Run backend lint
        working-directory: backend
        run: |
          python -m pip install ruff==0.8.6
          ruff check app --select E9,F63,F7,F82
      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend lint, type check, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check and build
        working-directory: frontend
        run: npm run build
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint infrastructure/helm/releasepilot
      - name: Render chart with external secret
        run: |
          helm template releasepilot infrastructure/helm/releasepilot \
            --set secrets.create=false \
            --set secrets.existingSecret=releasepilot-secrets
      - name: Render local database profile
        run: |
          helm template releasepilot infrastructure/helm/releasepilot \
            --set database.enabled=true \
            --set secrets.create=true \
            --set-string secrets.databaseUrl='postgresql+psycopg2://releasepilot:change-me@releasepilot-releasepilot-postgres:5432/releasepilot' \
            --set-string secrets.databasePassword=change-me \
            --set-string secrets.jwtSecretKey=change-me-long-random-value \
            --set-string secrets.adminInitialPassword=change-me
